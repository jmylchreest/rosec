name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Keep dependency installation on a known OS release rather than allowing
# ubuntu-latest migrations to change the runner and APT repositories implicitly.
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update -qq
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update -qq
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy (warnings as errors)
        run: cargo clippy --workspace --locked -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  providers:
    name: Provider checks
    uses: ./.github/workflows/provider-checks.yml

    needs:
      - scope
    if: needs.scope.outputs.providers == 'true'
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update -qq
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: Read declared MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Declared workspace rust-version: ${version}"

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-wasip1

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Check workspace on MSRV
        run: cargo check --workspace --locked --all-targets

      - name: Check WASM crates on MSRV
        run: |
          for crate in rosec-bitwarden-pm rosec-bitwarden-sm rosec-gnome-keyring rosec-keepassxc-file rosec-protonpass; do
            echo "::group::${crate}"
            (cd "${crate}" && cargo check --locked --target wasm32-wasip1)
            echo "::endgroup::"
          done

  docs:
    name: Docusaurus
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (strict — broken links + bad MDX fail the build)
        run: npm run build
    needs:
      - scope
    if: needs.scope.outputs.docs == 'true'
  scope:
    runs-on: ubuntu-24.04
    outputs:
      providers: ${{ steps.scope.outputs.providers }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo 'providers=true' >> "$GITHUB_OUTPUT"
            echo 'docs=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
          # Documentation-only changes cannot affect provider compilation or integration.
          if grep -Ev '(^docs/|\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/)' "$RUNNER_TEMP/changed-files" >/dev/null; then
            echo 'providers=true' >> "$GITHUB_OUTPUT"
          else
            echo 'providers=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(docs/|\.github/workflows/)' "$RUNNER_TEMP/changed-files"; then
            echo 'docs=true' >> "$GITHUB_OUTPUT"
          else
            echo 'docs=false' >> "$GITHUB_OUTPUT"
          fi
  complete:
    name: CI complete
    runs-on: ubuntu-24.04
    needs:
      - scope
      - test
      - clippy
      - fmt
      - providers
      - msrv
      - docs
    if: always()
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          for job in ('scope', 'test', 'clippy', 'fmt', 'msrv'):
              assert needs[job]['result'] == 'success', f"{job} did not succeed"
          for job in ('providers', 'docs'):
              required = needs['scope']['outputs'].get(job) == 'true'
              expected = 'success' if required else 'skipped'
              assert needs[job]['result'] == expected, f"{job}: expected {expected}"
          PYTHON
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
