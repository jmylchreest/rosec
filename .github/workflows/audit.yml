name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — catch advisories published against the committed
    # lockfiles even when no code changes land.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test audit exemption checker
        run: python3 tests/test_audit_exemptions.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Root workspace (rosecd, rosec CLI, libraries). Ignore-list and
      # rationale live in .cargo/audit.toml.
      - name: Audit workspace
        run: cargo audit

      # Excluded WASM provider crates carry their own lockfiles. cargo-audit
      # only reads a cwd-local .cargo/audit.toml, so the accepted advisories
      # are passed explicitly (see .cargo/audit.toml for the rationale):
      #   RUSTSEC-2023-0071  rsa "Marvin" — no upstream fix (via ssh-key)
      - name: Audit WASM provider crates
        run: |
          for crate in rosec-bitwarden-pm rosec-bitwarden-sm rosec-gnome-keyring rosec-keepassxc-file rosec-protonpass; do
            echo "::group::${crate}"
            # Only KeePassXC retains crypto-bigint 0.5 through ssh-key 0.6.
            # Temporary maintainer-approved exception; rationale and removal
            # criteria are recorded in .cargo/audit.toml and PR #69.
            extra_ignores=()
            if [[ "$crate" == rosec-keepassxc-file ]]; then
              extra_ignores+=(--ignore RUSTSEC-2026-0387)
            fi
            # Native Extism test host shares the root Wasmtime 49 cache blocker.
            # Tracking/removal criteria: issue #79 and .cargo/audit.toml.
            if [[ "$crate" == rosec-protonpass ]]; then
              extra_ignores+=(--ignore RUSTSEC-2026-0391 --ignore RUSTSEC-2026-0398 --ignore RUSTSEC-2026-0403)
            fi
            (cd "${crate}" && cargo audit --ignore RUSTSEC-2023-0071 "${extra_ignores[@]}")
            echo "::endgroup::"
          done

      # An accepted advisory that has quietly been fixed upstream is a stale
      # exemption, and stale exemptions are how the next real one gets waved
      # through. cargo audit cannot tell us — it filters ignored advisories out
      # of its own output — so re-run with the ignore list out of scope.
      - name: Check for stale audit exemptions
        run: ./contrib/check-stale-audit-ignores.sh
