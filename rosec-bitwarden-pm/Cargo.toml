[package]
name = "rosec-bitwarden-pm"
# Kept in lockstep with the workspace version (bumped by cargo-release via
# pre-release-replacements in ../release.toml). WASM providers must match the
# rosec-core ABI of the release they ship with.
version = "0.0.38"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Bitwarden PM provider as an Extism WASM guest plugin for rosec"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism guest SDK
extism-pdk = "1.4.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
sha2 = "0.11"
# rsa 0.9 requires digest 0.10 for OAEP.
sha1 = "0.10.7"
pbkdf2 = "0.13"
argon2 = "0.6"
hkdf = "0.13"
rsa = "0.9"
base64 = "0.23"
block-padding = "0.4"

# Zeroize for secret scrubbing
zeroize = { version = "1", features = ["derive", "serde"] }
