[package]
name = "rosec-keepassxc-file"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "KeePassXC .kdbx file provider as an Extism WASM guest plugin for rosec"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism guest SDK
extism-pdk = "1.4.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# KeePass / KDBX 4
keepass = { version = "0.12", default-features = false }

# Zeroize for secret scrubbing
zeroize = { version = "1", features = ["derive"] }

# Semver matches the host's manifest type
semver = { version = "1", features = ["serde"] }

# Time conversions for entry creation/modification times
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Base64 for binary-safe secret transport via the JSON protocol
base64 = "0.22"

# UUID parsing for resolving items by ID
uuid = { version = "1", default-features = false }

# Local patch: keepass-rs's `cfg(target_arch = "wasm32")` is too broad — it
# pulls in js-sys/wasm-bindgen for ALL wasm32 targets, including
# wasm32-wasip1 where wasm-bindgen post-processing isn't run and the
# placeholder imports remain unresolved.  Our fork narrows the cfg to
# `cfg(all(target_arch = "wasm32", target_os = "unknown"))` (browser only).
# PR: https://github.com/sseemayer/keepass-rs/pull/318
# Drop this `[patch.crates-io]` once that PR is merged + a release is cut.
[patch.crates-io]
keepass = { git = "https://github.com/jmylchreest/keepass-rs", branch = "local-version-bump" }
