[package]
name = "rosec-keepassxc-file"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "KeePassXC .kdbx file provider as an Extism WASM guest plugin for rosec"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism guest SDK
extism-pdk = "1.4.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# KeePass / KDBX 4
keepass = { version = "0.12", default-features = false }

# Zeroize for secret scrubbing
zeroize = { version = "1", features = ["derive"] }

# Semver matches the host's manifest type
semver = { version = "1", features = ["serde"] }
