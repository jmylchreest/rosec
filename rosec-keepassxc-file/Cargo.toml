[package]
name = "rosec-keepassxc-file"
# Kept in lockstep with the workspace version (bumped by cargo-release via
# pre-release-replacements in ../release.toml). WASM providers must match the
# rosec-core ABI of the release they ship with.
version = "0.0.32"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "KeePassXC .kdbx file provider as an Extism WASM guest plugin for rosec"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism guest SDK
extism-pdk = "1.4.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# KeePass / KDBX 4
keepass = { version = "0.13", default-features = false }

# Zeroize for secret scrubbing
zeroize = { version = "1", features = ["derive"] }

# Semver matches the host's manifest type
semver = { version = "1", features = ["serde"] }

# Time conversions for entry creation/modification times
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Base64 for binary-safe secret transport via the JSON protocol
base64 = "0.22"

# UUID parsing for resolving items by ID
uuid = { version = "1", default-features = false }

# SSH private key parsing — used to detect encrypted keys, decrypt with the
# entry password, and re-emit an unencrypted OpenSSH PEM that the host
# rosec-ssh-agent can ingest without further passphrase handling.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "rsa", "p256", "encryption"] }

# UTF-16 → UTF-8 conversion for KeePassXC's KeeAgent.settings XML payloads.
encoding_rs = "0.8"
