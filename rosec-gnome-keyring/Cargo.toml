[package]
name = "rosec-gnome-keyring"
# Kept in lockstep with the workspace version (bumped by cargo-release via
# pre-release-replacements in ../release.toml). WASM providers must match the
# rosec-core ABI of the release they ship with.
version = "0.0.32"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "GNOME Keyring read-only provider as an Extism WASM guest plugin for rosec"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism guest SDK
extism-pdk = "1.4.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto — GNOME Keyring binary format uses SHA-256-based KDF + AES-128-CBC.
# The file header claims "hash = MD5" but the actual gnome-keyring daemon
# uses SHA-256 via egg_symkey_generate_simple(GCRY_MD_SHA256, ...).
# MD5 is only used for the in-band integrity check after decryption.
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"

# Zeroize for secret scrubbing
zeroize = { version = "1", features = ["derive"] }

[package.metadata.cargo-machete]
# package md-5 exposes lib name "md5"; machete misses the rename
ignored = ["md-5"]
