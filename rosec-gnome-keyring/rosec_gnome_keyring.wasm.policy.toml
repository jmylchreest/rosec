schema_version = 1
kind = "gnome-keyring"
name = "GNOME Keyring"

# No network access — the plugin reads local keyring files only.
[network]
allowed_hosts = []

# Read-only access to the keyring directory. The user can override the
# default location via the keyring_dir option.
[[filesystem.preopens]]
host_template = "$option:keyring_dir"
guest_path = "/keyrings"
mode = "ro"

[options]
required = []
optional = ["keyring_dir", "keyrings"]

# Default keyring location when the user hasn't set keyring_dir. The
# default value is what host_template above resolves against, so the
# default location is auto-allowed too — no special-case in the daemon.
[options.defaults]
keyring_dir = "$home/.local/share/keyrings"
