schema_version = 1
kind = "gnome-keyring"
name = "GNOME Keyring"

# No network access — the plugin reads local keyring files only.
[network]
allowed_hosts = []

# Read-only access to the keyring directory. The user can override the
# default location via the keyring_dir option.
[[filesystem.preopens]]
host_template = "$option:keyring_dir"
guest_path = "/keyrings"
mode = "ro"

# `keyring_dir` is required under the v1 policy schema — earlier versions
# fell back to "$HOME/.local/share/keyrings" silently. Users should set it
# explicitly in rosec.toml (the default is the same path).
[options]
required = ["keyring_dir"]
optional = ["keyrings"]
