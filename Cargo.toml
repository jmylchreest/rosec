[workspace]
resolver = "2"
members = [
    "rosec-core",
    "rosec-secret-service",
    "rosec-ssh-agent",
    "rosec-fuse",
    "rosec-vault",
    "rosecd",
    "rosec",
    "rosec-prompt",
    "rosec-pam",
    "rosec-wasm",
    "rosec-tools",
    "rosec-uhid",
]
exclude = [
    "rosec-bitwarden-pm",
    "rosec-bitwarden-sm",
    "rosec-gnome-keyring",
    "rosec-keepassxc-file",
    "rosec-protonpass",
]

[workspace.package]
version = "0.0.36"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/jmylchreest/rosec"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
async-trait = "0.1.92"
zeroize = { version = "1.9.1", features = ["serde"] }
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "advanced"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "process"] }
wait-timeout = "0.2"
landlock = "0.4.7"
crossbeam-channel = "0.5"
toml = "1.1.8"
sha1 = "0.11.0"
sha2 = "0.11.0"
data-encoding = "2.11.1"
aes = { version = "0.9.3", features = ["zeroize"] }
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
hmac = "0.13.0"
hkdf = "0.13.0"
base64 = "0.23.1"
rand = "0.10.3"
block-padding = "0.4.2"
num-bigint = "0.5.1"
rpassword = "7"
libc = "0.2"
toml_edit = "0.25"
futures-util = { version = "0.3", features = ["sink"] }
tokio-websockets = { version = "0.13", features = ["client", "rustls-native-roots", "sha1_smol", "fastrand"] }
wildmatch = "2.6.1"
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
minisign = "0.10"
minisign-verify = "0.3"
pbkdf2 = "0.13.0"
tempfile = "3"
clap = { version = "4", features = ["derive", "wrap_help"] }
url = "2"

# Hoisted from per-crate declarations to ensure version consistency
zbus = "5.19.0"
zvariant = "5.15.0"
uuid = { version = "1.28.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
notify = "8"
busd = "0.5"
ssh-key = { version = "0.6.7", features = ["alloc", "ed25519", "rsa", "p256", "encryption"] }
ssh-agent-lib = "0.6.0"
fuser = "0.18.0"
# ssh-key 0.6 implements the signature 2 traits.
signature = "3.0.0"

# Dev dependencies for git hooks
husky-rs = "0.4"

# Patch ssh-key and ssh-encoding with the fixed version from the upstream 'stable' branch.
# Work around RSA signing bug in ssh-key 0.6.7.
# Remove when ssh-key 0.6.8 is released with the fix.
[patch.crates-io]
ssh-key = { git = "https://github.com/RustCrypto/SSH", branch = "stable", package = "ssh-key" }
ssh-encoding = { git = "https://github.com/RustCrypto/SSH", branch = "stable", package = "ssh-encoding" }

# Release with line-table debug info retained, so external profilers
# (samply, perf, heaptrack) produce accurate function-name + line-number
# stacks. Build cost is a few extra MiB on disk; runtime is identical to
# `release`.
#
# Use via:  cargo build --profile=profiling
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
