[workspace]
resolver = "2"
members = [
    "rosec-core",
    "rosec-secret-service",
    "rosec-ssh-agent",
    "rosec-fuse",
    "rosec-vault",
    "rosecd",
    "rosec",
    "rosec-prompt",
    "rosec-pam",
    "rosec-wasm",
]
exclude = [
    "rosec-bitwarden-pm",
    "rosec-bitwarden-sm",
    "rosec-gnome-keyring",
    "rosec-keepassxc-file",
]

[workspace.package]
version = "0.0.31"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/jmylchreest/rosec"

[workspace.dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
async-trait = "0.1.89"
zeroize = "1.8.2"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "advanced"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "process"] }
wait-timeout = "0.2"
landlock = "0.4.4"
crossbeam-channel = "0.5"
toml = "1.0.3"
sha1 = "0.10.6"
sha2 = "0.10.9"
data-encoding = "2.8.0"
aes = { version = "0.8.4", features = ["zeroize"] }
cbc = { version = "0.1.2", features = ["alloc", "std", "zeroize"] }
hmac = "0.12.1"
hkdf = "0.12.4"
base64 = "0.22.1"
rand = "0.10.0"
block-padding = "0.3.3"
num-bigint = { version = "0.4.6", features = ["rand"] }
rpassword = "7"
libc = "0.2"
toml_edit = "0.25"
futures-util = { version = "0.3", features = ["sink"] }
tokio-websockets = { version = "0.13", features = ["client", "rustls-native-roots", "sha1_smol", "fastrand"] }
wildmatch = "2.6.1"
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
minisign-verify = "0.2"
pbkdf2 = "0.12.2"
tempfile = "3"
clap = { version = "4", features = ["derive", "wrap_help"] }
url = "2"

# Hoisted from per-crate declarations to ensure version consistency
zbus = "5.14.0"
zvariant = "5.10.0"
uuid = { version = "1.21.0", features = ["v4"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "form"] }
notify = "8"
busd = "0.5"
ssh-key = { version = "0.6.7", features = ["alloc", "ed25519", "rsa", "p256", "encryption"] }
ssh-agent-lib = "0.5.1"
fuser = "0.17.0"
signature = "2"

# Dev dependencies for git hooks
husky-rs = "0.3"

# Patch ssh-key and ssh-encoding with the fixed version from the upstream 'stable' branch.
# Work around RSA signing bug in ssh-key 0.6.7.
# Remove when ssh-key 0.6.8 is released with the fix.
[patch.crates-io]
ssh-key = { git = "https://github.com/RustCrypto/SSH", branch = "stable", package = "ssh-key" }
ssh-encoding = { git = "https://github.com/RustCrypto/SSH", branch = "stable", package = "ssh-encoding" }

# Release with line-table debug info retained, so external profilers
# (samply, perf, heaptrack) produce accurate function-name + line-number
# stacks. Build cost is a few extra MiB on disk; runtime is identical to
# `release`.
#
# Use via:  cargo build --profile=profiling
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
