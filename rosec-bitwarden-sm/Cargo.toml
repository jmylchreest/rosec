[package]
name = "rosec-bitwarden-sm"
# Kept in lockstep with the workspace version (bumped by cargo-release via
# pre-release-replacements in ../release.toml). WASM providers must match the
# rosec-core ABI of the release they ship with.
version = "0.0.36"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-Bitwarden-SDK"
description = "Bitwarden Secrets Manager provider as an Extism WASM guest plugin for rosec"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism guest SDK
extism-pdk = "1.4.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (subset of PM — no RSA, no Argon2, no PBKDF2, no SHA-1)
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
sha2 = "0.11"
hkdf = "0.13"
base64 = "0.23"
block-padding = "0.4"

# Zeroize for secret scrubbing
zeroize = { version = "1", features = ["derive"] }
