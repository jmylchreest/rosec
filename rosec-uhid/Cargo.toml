[package]
name = "rosec-uhid"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Virtual FIDO2 (CTAP2) authenticator frontend for rosec: a /dev/uhid HID device browsers use as a security key"

[lib]
name = "rosec_uhid"
path = "src/lib.rs"

[[bin]]
name = "rosec-uhid"
path = "src/bin/broker.rs"

[dependencies]
rosec-core = { path = "../rosec-core" }
anyhow = { workspace = true }
libc = { workspace = true }
nix = { version = "0.31", features = ["socket", "uio", "user", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
# CTAP2 ceremony engine: COSE keys (coset, which re-exports the ciborium CBOR
# codec we use) + multi-algorithm signing.
coset = "0.3"
sha2 = { workspace = true }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
ed25519-dalek = { version = "3", features = ["pkcs8"] }
# rsa stays 0.9: it is the only signing crate not yet on rand_core 0.9, but
# RS256 here is assertion-only (deterministic PKCS#1 v1.5 signing needs no
# RNG), so its transitive rand_core 0.6 never reaches our code.
rsa = { version = "0.9", features = ["sha2"] }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
