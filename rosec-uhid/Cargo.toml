[package]
name = "rosec-uhid"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Virtual FIDO2 (CTAP2) authenticator frontend for rosec: a /dev/uhid HID device browsers use as a security key"

[lib]
name = "rosec_uhid"
path = "src/lib.rs"

[[bin]]
name = "rosec-uhid"
path = "src/bin/broker.rs"

[dependencies]
anyhow = { workspace = true }
libc = { workspace = true }
nix = { version = "0.32", features = ["socket", "uio", "user", "fs", "poll"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
# CTAP2 ceremony engine: COSE keys (coset, which re-exports the ciborium CBOR
# codec we use) + multi-algorithm signing.
coset = "0.4"
sha2 = { workspace = true }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "rand_core"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
# For makeCredential keypair generation (ES256/EdDSA).
rand = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
