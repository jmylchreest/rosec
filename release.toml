# cargo-release configuration
# https://github.com/crate-ci/cargo-release
#
# Usage (via Justfile — prefer that over invoking cargo-release directly):
#   just release-patch        # auto-bump patch from latest tag, dry-run
#   just release-patch push   # bump, commit, tag, push
#   just release 1.2.0        # explicit version, dry-run
#   just release 1.2.0 push   # explicit version, push
#
# cargo-release handles:
#   - Updating version in Cargo.toml (workspace root only, members inherit)
#   - Committing: "chore: release v{{version}}"
#   - Tagging:    "v{{version}}"
#   - Pushing tag + branch (when --execute --push are passed)
#
# We do NOT publish to crates.io — this is a binary workspace, not a library.

# Single workspace release — version is set in [workspace.package] and all
# workspace members use version.workspace = true, so only the root needs bumping.
#
# The WASM provider crates (rosec-bitwarden-pm, rosec-bitwarden-sm,
# rosec-gnome-keyring, rosec-keepassxc-file) are excluded from the workspace
# because they target wasm32-wasip1 and have their own Cargo.lock files.
# They must still match the rosec-core ABI of the release they ship with, so
# pre-release-replacements below keep their `version = "..."` in lockstep.
shared-version = true

# Bump the version line in each excluded WASM provider Cargo.toml so they
# stay aligned with the workspace version. `min = 1, max = 1` enforces that
# exactly one match must be found and replaced per file — fails loudly if a
# crate's manifest drifts from this format. `prerelease = true` ensures these
# also run for pre-release versions (cargo-release defaults this to false for
# replacements, which would skip dev/alpha bumps).
pre-release-replacements = [
  { file = "rosec-bitwarden-pm/Cargo.toml",   search = '^version = "[^"]+"$', replace = 'version = "{{version}}"', min = 1, max = 1, prerelease = true },
  { file = "rosec-bitwarden-sm/Cargo.toml",   search = '^version = "[^"]+"$', replace = 'version = "{{version}}"', min = 1, max = 1, prerelease = true },
  { file = "rosec-gnome-keyring/Cargo.toml",  search = '^version = "[^"]+"$', replace = 'version = "{{version}}"', min = 1, max = 1, prerelease = true },
  { file = "rosec-keepassxc-file/Cargo.toml", search = '^version = "[^"]+"$', replace = 'version = "{{version}}"', min = 1, max = 1, prerelease = true },
]

# Do not publish any crates to crates.io
publish = false

# Tag format — must match the pattern GHA release.yml expects: refs/tags/v*
tag-name = "v{{version}}"
tag-message = "v{{version}}"

# Commit message for the version bump commit
pre-release-commit-message = "chore: release v{{version}}"

# Run these checks before doing anything. Mirrors what GHA CI runs.
pre-release-hook = ["cargo", "clippy", "--", "-D", "warnings"]

# Sign the release commit and tag (requires gpg.format = ssh or GPG in git config).
sign-commit = true
sign-tag = true

# Do not push by default — the Justfile controls when to push.
# This prevents accidental pushes when running cargo-release directly.
push = false

# Note: do NOT set `release = false` here — cargo-release interprets that as
# "skip this package entirely", not "don't create a GitHub release".
# GitHub releases are handled by GHA on tag push, not by cargo-release.
