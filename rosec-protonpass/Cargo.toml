[package]
name = "rosec-protonpass"
version = "0.0.35"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
publish = false
description = "Read-only Proton Pass provider for rosec"

[features]
# Never enable for a distributed plugin.
test-http = []

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Enable wiping throughout AES-GCM's key schedule and authentication state.
aes = { version = "0.8", features = ["zeroize"] }
ctr = { version = "0.9", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
base64 = "0.22"
protobuf = "=3.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive", "serde"] }
urlencoding = "2"
getrandom = "0.2"
rmp-serde = "1.3"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "zeroize"] }

[target.'cfg(target_family = "wasm")'.dependencies]
extism-pdk = "1.4.1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
extism = "=1.41.0"
rosec-core = { path = "../rosec-core" }

rosec-wasm = { path = "../rosec-wasm" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
