[package]
name = "rosec-protonpass"
version = "0.0.35"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Experimental read-only Proton Pass Extism feasibility spike"

[features]
# Never enable for a distributed plugin.
test-http = []

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Enable wiping throughout AES-GCM's key schedule and authentication state.
aes = { version = "0.8", features = ["zeroize"] }
ctr = { version = "0.9", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
base64 = "0.22"
protobuf = "=3.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
urlencoding = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
extism-pdk = "1.4.1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
extism = "=1.41.0"
rosec-core = { path = "../rosec-core" }
