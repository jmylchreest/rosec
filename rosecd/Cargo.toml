[package]
name = "rosecd"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
anyhow = { workspace = true }
rosec-core = { path = "../rosec-core" }
rosec-vault = { path = "../rosec-vault" }
rosec-wasm = { path = "../rosec-wasm" }
rosec-secret-service = { path = "../rosec-secret-service" }
rosec-ssh-agent = { path = "../rosec-ssh-agent" }
rosec-fuse = { path = "../rosec-fuse" }
rosec-uhid = { path = "../rosec-uhid" }
data-encoding = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
zeroize = { workspace = true }
serde_json = { workspace = true }
ssh-key = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
busd = { workspace = true, optional = true }
console-subscriber = { version = "0.5", optional = true }

[features]
default = ["private-socket"]
private-socket = ["dep:busd"]
# tokio-console integration. Requires `--cfg tokio_unstable` in RUSTFLAGS.
# Use the `just profile-build` recipe, which sets the cfg automatically.
console = ["dep:console-subscriber"]

[dev-dependencies]
husky-rs = { workspace = true }
